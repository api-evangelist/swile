name: Swile
description: >-
  Swile is a French fintech that operates an all-in-one employee-benefits and
  engagement super-app built around a single Mastercard smartcard and mobile
  app. Founded in 2018 as Lunchr and rebranded Swile in 2020, it consolidates
  meal vouchers (titres-restaurant), gift and culture vouchers, mobility and
  work-from-home allowances, and team/recognition budgets that were historically
  spread across paper vouchers and multiple providers. The company merged with
  Bimpli in France, expanded into Brazil through Vee Benefícios, and is backed by
  investors including Index Ventures, SoftBank Vision Fund, and Bpifrance. Swile
  serves employers and their employees rather than external developers: as of
  this enrichment pass it publishes a security surface (RFC 9116 security.txt, a
  coordinated vulnerability disclosure policy, and a researcher hall of fame) but
  no public developer portal, OpenAPI, or API reference.
